<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>영화 & 책 아카이브</title>

<style>
body{
    font-family: Arial, sans-serif;
    max-width: 1000px;
    margin: 40px auto;
    padding: 20px;
    background:#f5f5f5;
}

h1{
    text-align:center;
}

.container{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

input, textarea, select{
    width:100%;
    padding:10px;
    margin:8px 0;
    border:1px solid #ddd;
    border-radius:8px;
}

button{
    background:#4f46e5;
    color:white;
    border:none;
    padding:10px 16px;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    background:#4338ca;
}

.item{
    background:#fafafa;
    padding:12px;
    border-radius:8px;
    margin-top:10px;
    border-left:4px solid #4f46e5;
}

.delete{
    background:#ef4444;
    margin-top:10px;
}

.delete:hover{
    background:#dc2626;
}

.badge{
    display:inline-block;
    background:#e0e7ff;
    color:#4338ca;
    padding:4px 8px;
    border-radius:999px;
    font-size:12px;
}
</style>
</head>
<body>

<h1>🎬📚 영화 & 책 아카이브</h1>

<div class="card">
    <h2>새 기록 추가</h2>

    <select id="type">
        <option value="영화">영화</option>
        <option value="책">책</option>
    </select>

    <input id="title" placeholder="제목">

    <input id="rating" type="number" min="1" max="10" placeholder="평점 (1~10)">

    <textarea id="review" rows="4" placeholder="감상평"></textarea>

    <button onclick="addItem()">저장하기</button>
</div>

<br>

<div class="container">
    <div class="card">
        <h2>🎬 영화 목록</h2>
        <div id="movies"></div>
    </div>

    <div class="card">
        <h2>📚 책 목록</h2>
        <div id="books"></div>
    </div>
</div>

<script>
let archive = JSON.parse(localStorage.getItem("archive")) || [];

function saveData(){
    localStorage.setItem("archive", JSON.stringify(archive));
}

function addItem(){

    const type = document.getElementById("type").value;
    const title = document.getElementById("title").value.trim();
    const rating = document.getElementById("rating").value;
    const review = document.getElementById("review").value.trim();

    if(!title){
        alert("제목을 입력하세요.");
        return;
    }

    archive.unshift({
        id: Date.now(),
        type,
        title,
        rating,
        review
    });

    saveData();
    render();

    document.getElementById("title").value="";
    document.getElementById("rating").value="";
    document.getElementById("review").value="";
}

function deleteItem(id){
    archive = archive.filter(item => item.id !== id);
    saveData();
    render();
}

function render(){

    const movies = document.getElementById("movies");
    const books = document.getElementById("books");

    movies.innerHTML = "";
    books.innerHTML = "";

    archive.forEach(item => {

        const html = `
            <div class="item">
                <span class="badge">⭐ ${item.rating || "-"}</span>
                <h3>${item.title}</h3>
                <p>${item.review}</p>
                <button class="delete"
                    onclick="deleteItem(${item.id})">
                    삭제
                </button>
            </div>
        `;

        if(item.type === "영화"){
            movies.innerHTML += html;
        }else{
            books.innerHTML += html;
        }
    });
}

render();
</script>

</body>
</html>
